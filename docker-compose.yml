services:
  database:
    image: postgis/postgis:17-3.7
    container_name: neighbourhood-insight-db
    environment:
      POSTGRES_DB: neighbourhood_insight
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
